[package]
name = "save"
version = "0.1.0"
edition = "2021"

[lints]
workspace = true

[dependencies]
bevy.workspace = true
models     = { path = "../models" }
keybinds   = { path = "../keybinds" }
dialog     = { path = "../dialog" }
quest      = { path = "../quest" }
serde      = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys      = { version = "0.3.104", features = ["Window", "Storage"] }
wasm-bindgen = "0.2.127"
